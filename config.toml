[data]
#set up the region name
region_mapping_name = "Dobrich"

#aoi 
aoi = "data/aoi/Dobrich_Province_Boundaries.geojson"

#set up the optimal time window for fetching the sat image for training - lavender flowering: few clouds and full coverage
train_date_range_2021 = "2021-07-01/2021-07-03"
train_date_range_2023 = "2023-07-01/2023-07-03"
train_date_range_2025 = "2025-07-01/2025-07-03"

#training and tes aoi
train_area_geo = "data/training&val_aoi/Bulgaria_Dobrich_training_AOI.geojson"
test_area_geo = "data/training&val_aoi/Bulgaria_Dobrich_test_AOI.geojson"

[options]
cloud_cover = 50